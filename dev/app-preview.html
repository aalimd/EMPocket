<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local app layout preview</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;display:block}</style></head><body><iframe title="Local app preview"></iframe><script>
(async()=>{if(!['localhost','127.0.0.1'].includes(location.hostname))return;const frame=document.querySelector('iframe'),doc=new DOMParser().parseFromString(await(await fetch('../index.html?preview=header2')).text(),'text/html');doc.querySelector('#disclaimerOverlay').remove();const base=doc.createElement('base');base.href=new URL('../',location.href);doc.head.prepend(base);frame.addEventListener('load',()=>{frame.contentWindow.location.hash=new URLSearchParams(location.search).get('route')||'ecg-explorer';},{once:true});frame.srcdoc='<!doctype html>'+doc.documentElement.outerHTML;})();
</script></body></html>
